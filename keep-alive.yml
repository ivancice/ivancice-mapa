# Bezplatný projekt Supabase se po týdnu nečinnosti uspí. Tato úloha
# jednou denně zavolá veřejné API, aby databáze zůstala aktivní.
# Používá proměnné SUPABASE_URL a SUPABASE_ANON_KEY (stejné jako nasazení webu).
name: Udržení databáze v provozu
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Dotaz na veřejné API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${{ vars.SUPABASE_URL }}/rest/v1/rpc/get_public_config" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"
          test "$code" = "200"
